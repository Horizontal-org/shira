---
services:
  api:
    image: "horizontalorg/shira-api:${VERSION:-latest}"
    restart: "unless-stopped"
    environment:
      JWT_SECRET: "${JWT_SECRET}"
      MYSQL_HOST: "${MYSQL_HOST:-db}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-shira}"
      MYSQL_USER: "${MYSQL_USER:-shira}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      IMAGE_ENDPOINT: "${IMAGE_ENDPOINT:-images}"
      IMAGE_PORT: "${IMAGE_PORT:-3900}"
      IMAGE_BUCKET: "${IMAGE_BUCKET:-shira}"
      IMAGE_ACCESS_KEY: "${IMAGE_ACCESS_KEY}"
      IMAGE_SECRET_KEY: "${IMAGE_SECRET_KEY}"
      PUBLIC_URL: "${PUBLIC_URL}"
      SPACE_URL: "${SPACE_URL}"
    depends_on:
      db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
      images:
        condition: "service_healthy"
    ports:
    - '3000:3000'
    networks:
    - "shira"
  db:
    image: "mysql:5.7"
    restart: "unless-stopped"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
    - "db-data:/var/lib/mysql"
    networks:
    - "shira"
    healthcheck:
      test:
      - "CMD"
      - "mysql"
      - "--host=${MYSQL_HOST:-db}"
      - "--user=$MYSQL_USER"
      - "--password=$MYSQL_PASSWORD"
      - "--execute=SHOW\ DATABASES;"
      interval: "30s"
      timeout: "10s"
      retries: 10
      start_period: "10s"
  redis:
    image: "bitnami/redis:latest"
    restart: "unless-stopped"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    networks:
    - "shira"
    volumes:
    - "redis-data:/data"
    healthcheck:
      test:
      - "CMD"
      - "redis-cli"
      - "-a"
      - "$REDIS_PASSWORD"
      - "--raw"
      - "incr"
      - "ping"
      interval: "30s"
      timeout: "10s"
      retries: 10
      start_period: "10s"
  images:
    image: "dxflrs/garage:v2.3.0"
    restart: "unless-stopped"
    environment:
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET}"
    networks:
    - "shira"
    volumes:
    - "images-data:/var/lib/garage/"
    - "./garage.toml:/etc/garage.toml"
    healthcheck:
      test:
      - "CMD"
      - "/garage"
      - "status"
      interval: "30s"
      timeout: "10s"
      retries: 10
      start_period: "10s"
    environment:
      ACME_HOST: "${IMAGES_DOMAIN}"
      VIRTUAL_HOST: "${IMAGES_DOMAIN}"
      VIRTUAL_PORT: "3900"
  frontend:
    image: "horizontalorg/shira-frontend:${VERSION:-latest}"
    restart: "unless-stopped"
    networks:
    - "shira"
    volumes:
    - "./templates:/etc/nginx/templates"
    depends_on:
    - "api"
    environment:
      SPACES_DOMAIN: "${SPACES_DOMAIN}"
      QUIZ_DOMAIN: "${QUIZ_DOMAIN}"
      ACME_HOST: "${SPACES_DOMAIN},${QUIZ_DOMAIN}"
      VIRTUAL_HOST: "${SPACES_DOMAIN},${QUIZ_DOMAIN}"
      VIRTUAL_PORT: "80"
  nginx:
    image: "nginxproxy/nginx-proxy:1.10.1"
    container_name: "nginx"
    volumes:
    - "html:/usr/share/nginx/html"
    - "dhparam:/etc/nginx/dhparam"
    - "certs:/etc/nginx/certs"
    - "/run/docker.sock:/tmp/docker.sock:ro"
    restart: "unless-stopped"
    networks:
    - "shira"
    ports:
    - "80:80"
    - "443:443"
  letsencrypt:
    image: "nginxproxy/acme-companion:2.6.3"
    volumes:
    - "html:/usr/share/nginx/html"
    - "dhparam:/etc/nginx/dhparam"
    - "certs:/etc/nginx/certs"
    - "/run/docker.sock:/var/run/docker.sock:ro"
    restart: "unless-stopped"
    depends_on:
    - "nginx"
    networks:
    - "shira"
    environment:
      NGINX_PROXY_CONTAINER: "nginx"
      DEFAULT_EMAIL: "${SMTP_GLOBAL_FROM}"
networks:
  shira:
volumes:
  db-data:
  redis-data:
  images-data:
  dhparam:
  certs:
  html:
