---
name: "Publish Docker image"
on:
  push:
    branches:
    - "development"
    - "main"
    - "github-action"
    tags:
    - "*"
jobs:
  push_to_registry:
    name: "Push Docker image to Docker Hub"
    runs-on: "ubuntu-latest"
    permissions:
      packages: "write"
      contents: "read"
      attestations: "write"
      id-token: "write"
    steps:
      - name: "Check out the repo"
        uses: "actions/checkout@v6"
      - name: "Log in to Docker Hub"
        uses: "docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a"
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"
      - name: "Extract metadata (tags, labels) for Docker"
        id: "frontend-meta"
        uses: "docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7"
        with:
          images: "horizontalorg/shira-frontend"
      - name: "Build and push frontend Docker image"
        id: "frontend-push"
        uses: "docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671"
        with:
          context: "."
          file: "./Dockerfile"
          push: true
          tags: "${{ steps.frontend-meta.outputs.tags }}"
          labels: "${{ steps.frontend-meta.outputs.labels }}"
      - name: "Generate artifact attestation"
        uses: "actions/attest@v4"
        with:
          subject-name: "index.docker.io/horizontalorg/shira-frontend"
          subject-digest: "${{ steps.frontend-push.outputs.digest }}"
          push-to-registry: true
      - name: "Extract metadata (tags, labels) for Docker"
        id: "api-meta"
        uses: "docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7"
        with:
          images: "horizontalorg/shira-api"
      - name: "Build and push API Docker image"
        id: "api-push"
        uses: "docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671"
        with:
          context: "apps/api"
          file: "./Dockerfile.production"
          push: true
          tags: "${{ steps.api-meta.outputs.tags }}"
          labels: "${{ steps.api-meta.outputs.labels }}"
      - name: "Generate artifact attestation"
        uses: "actions/attest@v4"
        with:
          subject-name: "index.docker.io/horizontalorg/shira-api"
          subject-digest: "${{ steps.api-push.outputs.digest }}"
          push-to-registry: true
      - uses: "mattermost/action-mattermost-notify@master"
        if: "success()"
        with:
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MATTERMOST_WEBHOOK_URL }}"
          PAYLOAD: |-
            {
              "text": "Images built for ${{ github.repository }}",
              "channel": "github-actions",
              "username": "${{ github.triggering_actor }}",
            }
      - uses: "mattermost/action-mattermost-notify@master"
        if: "failure()"
        with:
          MATTERMOST_WEBHOOK_URL: "${{ secrets.MATTERMOST_WEBHOOK_URL }}"
          PAYLOAD: |-
            {
              "text": "Images failed to build for ${{ github.repository }}",
              "channel": "github-actions",
              "username": "${{ github.triggering_actor }}",
            }
