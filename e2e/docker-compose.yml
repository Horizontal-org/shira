name: shira-e2e
services:
  api:
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    ports:
      - '127.0.0.1:13000:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(2000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 30
  mysql:
    image: mysql:5.7.44
    platform: linux/amd64
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    environment:
      MYSQL_DATABASE: shira_e2e
      MYSQL_USER: shira_e2e
      MYSQL_PASSWORD: shira_e2e
      MYSQL_ROOT_PASSWORD: shira_e2e_root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysql', '-h', '127.0.0.1', '-ushira_e2e', '-pshira_e2e', 'shira_e2e', '-e', 'SELECT 1']
      interval: 2s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30
